[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "falkordb>=1.8.1",
    "fastapi>=0.162.0",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "google-auth-oauthlib>=1.5.0",
    "jinja2>=3.1.6",
    "langchain-community<0.4",
    "langfuse>=5.1.0",
    "openai>=3.0,<3.42",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "pillow>=13.0.0",
    "psycopg[binary,pool]>=3.3.6",
    "pymupdf>=2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "ragas>=0.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["F", "E9"]   # undefined names, unused imports/variables, syntax errors; style stays a non-goal
